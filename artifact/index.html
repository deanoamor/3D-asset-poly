`,blender:`Option A: glTF (recommended)
1. File > Import > glTF 2.0 (.glb/.gltf) and pick ${t.modelName}.glb.
2. Switch the viewport to Material Preview (press Z, then pick it, or click the second-to-last sphere icon at the top right of the viewport). The default Solid mode shows every imported material in grey; it is a Blender display setting, not a problem with the file.
   In Solid mode you can also set Shading > Color to Material or Attribute.
3. Smooth/painted colors are stored as vertex colors (COLOR_0). In the material, add a Color Attribute node into Base Color to see them.
${t.hasObj?`
Option B: OBJ
1. File > Import > Wavefront (.obj) and pick the .obj in the "obj" folder (keep the .mtl next to it).
2. Only base colors are carried, not the painted variation.

Skeleton: characters come with an Armature. Select it and press Ctrl+Tab for Pose Mode, then rotate a bone (R) to bend the character. The whole character is one skinned mesh.\nScale: 1 unit = 1 metre, Y up. Blender converts to Z up on import.
`,c4d:`Option A: OBJ (every version)
1. File > Merge (or Open) and pick the .obj in the "obj" folder. Keep the .mtl next to it.
2. In the import dialog set the scale to Meters, or scale the model 100x if it looks tiny (Cinema 4D defaults to centimetres).
3. Each part is a separate object with its own material.
${t.hasObj,``}
Option B: glTF (Cinema 4D 2023 and later)
1. File > Merge and pick ${t.modelName}.glb.
2. Vertex colors may need a Vertex Color tag/shader to be visible.

Pivot: bottom center. Y up, same as Cinema 4D.
`,maya:`Maya:
1. File > Import and pick the .obj in the "obj" folder (keep the .mtl beside it). Set Units to metres in Preferences if the size is off.
2. Newer Maya versions can import .glb through the glTF plugin.

3ds Max:
1. File > Import and pick the .obj. In the import dialog keep "Convert units" on, and set the model unit to metres.
2. Max uses Z up: rotate 90 degrees on X if the model lies on its back.

ZBrush / Modo / others: import the .obj. Colors come from the .mtl as materials.
`,construct:`Construct 3 (3D Model object):
1. In the Project Bar, right-click the "3D Models" folder and choose Import > From file, then pick ${t.modelName}.glb.
   (You can also drag the .glb into the Layout View.) A .glb holds everything in one file, so "From file" is the right choice.
2. Add a 3D Model object to your layout and choose this model in its properties.
3. Size: the model is in metres (1 unit = 1 metre), but Construct measures in pixels. Use the Scale property (or the object's width/height/depth) until it looks right, for example 100 for 1 m.
4. Pivot: the origin is at the bottom center, so Y = 0 is the floor.
5. Collision: a 3D Model object has no collision of its own. Add a Solid behavior or use a simple 2D/3D Shape object for the hitbox.
Requires a Construct version that has the 3D Model object (recent releases). If your version does not show it, use the 3D Object add-on with the .glb.

ll the points at the knee a little forward. The leg runs into the boot, so there is no gap. The belt is a short, wide ring around the waist with a gold buckle.`,tools:[`Cylinder: Top size`,`Edit shape: move points`,`Mirror for the other leg`]},{title:`Shirt`,text:`The torso is one shape that is wider at the shoulders than at the waist: a Box or Cylinder with the top face scaled up in Edit shape. Round blobs (spheres with 6 sides) cap the shoulders. Pockets, flaps, collar, tie and badge are thin parts laid on the surface of the shirt.`,tools:[`Edit shape: scale a face (R)`,`Shape: Sphere, 6 sides`,`Thin boxes for layers`]},{title:`Arms and hands`,text:`Each arm is one tube from the shoulder to the wrist, bent at the elbow. Extrude the end of a Cylinder (Pull out) twice and move the new face to bend it. The hand is a flat, rounded shape with a separate thumb. A cuff ring hides where sleeve and hand meet.`,tools:[`Edit shape: Pull out, Move (W)`,`Cylinder: Top size`,`Shape: Sphere`]},{title:`Head and face`,text:`The head is a Sphere with 8 sides and a narrower jaw, reshaped in Edit shape. Every facial feature sits on the surface so nothing floats: white eye blobs with smaller pupils, curved eyebrows, a Pyramid nose pointing outward, and a curved mouth.`,tools:[`Edit shape: narrow the jaw`,`Shape: Pyramid + Rotate (E)`,`Mirror for symmetry`]},{title:`Hair, mustache and cap`,text:`Hair is a few flattened spheres on and behind the head. The mustache and sideburns are thin curved strips that follow the face. The cap is a band, a crown that widens toward the top, a flat top and a peak that is attached to the band. A gold badge goes on the front.`,tools:[`Squash with Size (R)`,`Cylinder: 10 sides + Top size`,`Rotate (E)`]},{title:`Gear`,text:`A chest badge with a star, a name tag, a radio with an antenna, a holster, a baton, and a pouch at the back. Each is a small part pressed onto the surface it hangs from. Name every part in Layers and group them as Police Officer.`,tools
