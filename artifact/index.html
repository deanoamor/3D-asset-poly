   It is a box that wraps the whole model. Open the imported scene to check it.
`:`3. For collision, open the Advanced Import Settings and use Physics > Generate, or add a CollisionShape3D yourself.
`}`,unreal:`1. Enable the glTF Importer plugin (or Interchange) in Edit > Plugins and restart.
2. In the Content Browser choose Import and pick ${t.modelName}.glb.
3. Open the new Static Mesh and compare its size with the numbers above.
4. Collision: in the Static Mesh Editor use Collision > Add Box Simplified Collision.
`,blender:`Option A: glTF (recommended)
1. File > Import > glTF 2.0 (.glb/.gltf) and pick ${t.modelName}.glb.
2. Switch the viewport to Material Preview (press Z, then pick it, or click the second-to-last sphere icon at the top right of the viewport). The default Solid mode shows every imported material in grey; it is a Blender display setting, not a problem with the file.
   In Solid mode you can also set Shading > Color to Material or Attribute.
3. Smooth/painted colors are stored as vertex colors (COLOR_0). In the material, add a Color Attribute node into Base Color to see them.
${t.hasObj?`
Option B: OBJ
1. File > Import > Wavefront (.obj) and pick the .obj in the "obj" folder (keep the .mtl next to it).
2. Only base colors are carried, not the painted variation.
`:``}
Skeleton: characters come with an Armature. Select it and press Ctrl+Tab for Pose Mode, then rotate a bone (R) to bend the character. The whole character is one skinned mesh.\nScale: 1 unit = 1 metre, Y up. Blender converts to Z up on import.
`,c4d:`Option A: OBJ (every version)
1. File > Merge (or Open) and pick the .obj in the "obj" folder. Keep the .mtl next to it.
2. In the import dialog set the scale to Meters, or scale the model 100x if it looks tiny (Cinema 4D defaults to centimetres).
3. Each part is a separate object with its own material.
${t.hasObj,``}
Option B: glTF (Cinema 4D 2023 and later)
1. File > Merge and pick ${t.modelName}.glb.
2. Vertex colors may need a Vertex Color tag/shader to be visible.

Pivot: bottom center. Y up, same as Cinema 4D.
`,maya:`Maya:
1. File > Import and pick the .obj in the "obj" folder (keep the .mtl beside it). Set Units to metres in Preferences if the size is off.
2. Newer Maya versions can import .glb through the glTF plugin.

3ds Max:
1. File > Import and pick the .obj. In the import dialog keep "Convert units" on, and set the model unit to metres.
2. Max uses Z up: rotate 90 degrees on X if the model lies on its back.

ZBrush / Modo / others: import the .obj. Colors come from the .mtl as materials.
`,construct:`Construct 3 (3D Model object):
1. In the Project Bar, right-click the "3D Models" folder and choose Import > From file, then pick ${t.modelName}.glb.
   (You can also drag the .glb into the Layout View.) A .glb holds everything in one file, so "From file" is the right choice.
2. Add a 3D Model object to your layout and choose this model in its properties.
3. Size: the model is in metres (1 unit = 1 metre), but Construct measures in pixels. Use the Scale property (or the object's width/height/depth) until it looks right, for example 100 for 1 m.
4. Pivot: the origin is at the bottom center, so Y = 0 is the floor.
5. Collision: a 3D Model object has no collision of its own. Add a Solid behavior or use a simple 2D/3D Shape object for the hitbox.
Requires a Construct version that has the 3D Model object (recent releases). If your version does not show it, use the 3D Object add-on with the .glb.
`,web:`three.js:
  import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';
  new GLTFLoader().load('${t.modelName}.glb', (gltf) => scene.add(gltf.scene));

<model-viewer> (Google):
  <model-viewer src="${t.modelName}.glb" camera-controls></model-viewer>

apered tube`,`Shape a head and put a face on it`,`Layer uniform, tie, pockets and badges`,`Add gear that tells the story`],steps:[{title:`Boots`,text:`A boot is one shape that flows from the shaft into the foot, with a flat sole under it and a lighter cuff on top. Start with a Cylinder (8 sides) for the shaft, then pull its bottom face out toward the toe with Pull out and shape it. Duplicate it for the other foot.`,tools:[`Shape: Cylinder`,`Edit shape: Pull out (P)`,`Duplicate Ctrl+D`]},{title:`Legs and belt`,text:`Each leg is one tube, wide at the hip and narrow at the ankle, with a small bend at the knee. Make it from a Cylinder: lower the Top size, then use Edit shape to pull the points at the knee a little forward. The leg runs into the boot, so there is no gap. The belt is a short, wide ring around the waist with a gold buckle.`,tools:[`Cylinder: Top size`,`Edit shape: move points`,`Mirror for the other leg`]},{title:`Shirt`,text:`The torso is one shape that is wider at the shoulders than at the waist: a Box or Cylinder with the top face scaled up in Edit shape. Round blobs (spheres with 6 sides) cap the shoulders. Pockets, flaps, collar, tie and badge are thin parts laid on the surface of the shirt.`,tools:[`Edit shape: scale a face (R)`,`Shape: Sphere, 6 sides`,`Thin boxes for layers`]},{title:`Arms and hands`,text:`Each arm is one tube from the shoulder to the wrist, bent at the elbow. Extrude the end of a Cylinder (Pull out) twice and move the new face to bend it. The hand is a flat, rounded shape with a separate thumb. A cuff ring hides where sleeve and hand meet.`,tools:[`Edit shape: Pull out, Move (W)`,`Cylinder: Top size`,`Shape: Sphere`]},{title:`Head and face`,text:`The head is a Sphere with 8 sides and a narrower jaw, reshaped in Edit shape. Every facial feature sits on the surface so nothing floats: white eye blobs with smaller pupils, curved eyebrows, a Pyramid nose pointing outward, and a curved mouth.`,tools:[`Edit shape: narrow the jaw`,`Shape: Pyramid + Rotate (E)`,`Mirror for symmetry`]},{title:`Hair, mustache and cap`,text:`Hair is a few flattened spheres on and behind the head. The mustache and sideburns are thin curved strips that follow the face. The cap is a band, a crown that widens toward the top, a flat top and a peak that is attached to the band. A gold badge goes on the front.`,tools:[`Squash with Size (R)`,`Cylinder: 10 sides + Top size`,`Rotate (E)`]},{title:`Gear`,text:`A chest badge with a star, a name tag, a radio with an antenna, a holster, a baton, and a pouch at the back. Each is a small part pressed onto the surface it hangs from. Name every part in Layers and group them as Police Officer.`,tools:[`Rename in Layers`,`Group Ctrl+G`,`Color palette`]},{title:`Skeleton: joints and bones`,text:`A skeleton lets a 3D app bend the character. The white balls are joints (hips, knees, shoulders, elbows, wrists, neck, head) and the teal lines between them are bones. Each bone is moved by the joint it starts from, so turning a shoulder swings the whole arm. When you export to GLB, every part is skinned to these joints automatically: long parts like arms and legs bend smoothly at the joints, small parts like a helmet or a pouch follow one joint. Press Pose, pick a joint and turn it with the rings: the character bends right in the editor.`,tools:[`Skeleton panel (under Layers)`,`Drag a joint`,`Shift+drag: carry its children`,`Pose mode: turn a joint`],rig:!0}],challenge:`Make a detective: remove the cap, give the officer a hat with a wide brim, and swap the shirt for a long coat by scaling a copy of the torso larger.`,parts:Iv},Xv=`#d9503a`,Zv=`#b83e2c`,Qv=`#f1ece4`,$v=`#2a2d33`,ey=`#1d2026`,ty=`#c9ced6`,ny=`#79c4e6`,ry=`#5aa6cc`,iy=`#fff1a8`,ay=`#f0a030`,oy=`#e03030`,sy=`#22252b`,cy=`#d5d9df`,ly=`#6b727a`,uy=-.2,dy=1.1,fy=.62,py=.82,my=[[.84,1.3],[.84,-1.3]],hy=[G(0,`Underbody`,[0,.3,0],[1.7,.2,4],ey),Z_(0,`Body`,`box`,[0,.6,0],[1.86,.5,4.2],Xv,{mesh:()=>Y_(1,1,.94,.985)}),...ev(`Side Skirt`,(e,t)=>  The red sock and the white shorts are slightly thicker tubes over the same leg.`,tools:[`Cylinder: Top size`,`Edit shape: Pull out, Move (W)`,`Duplicate Ctrl+D`]},{title:`Jersey`,text:`The jersey is one shape that is wider at the shoulders than at the waist, leaning forward a little. A white chest band and hem are thin rings around it, the V collar is a curved strip, and the crest and the number 10 are thin plates lying on the front.`,tools:[`Edit shape: scale a face (R)`,`Thin boxes for numbers`,`Rotate (E)`]},{title:`Arms`,text:`One arm hangs relaxed and the other is bent at the elbow to carry the ball at hip height. Each arm is one tube bent at the elbow, with a thicker red sleeve over its upper half and a white hem. A gold band marks the captain. Hands are rounded with a thumb on the side.`,tools:[`Edit shape: Pull out + Move`,`Cylinder: Top size`,`Shape: Sphere`]},{title:`Head and face`,text:`The head is a Sphere with 8 sides and a narrower jaw. Eyes, eyebrows, the nose and the smile are placed on the surface of the head so they never float. Big eyes give it a friendly, cartoon feel.`,tools:[`Edit shape: narrow the jaw`,`Mirror for symmetry`,`Shape: Pyramid + Rotate`]},{title:`Hair and headband`,text:`Hair is two flattened spheres plus eight spikes. Each spike is a short tube that starts inside the head and tapers to a point, tilted a different way so they do not look copied. A red headband is a thin ring around the forehead.`,tools:[`Cylinder: Top size near 0`,`Rotate (E)`,`Duplicate Ctrl+D`]},{title:`The ball`,text:`A football is a white 20-sided-hexagon ball with 12 black pentagons. Build the ball first, then add each black pentagon as a thin flat shape lying exactly on one of its faces. The hand sits against the ball so it is held, and nothing floats. Name every part and group them as Football Player.`,tools:[`Shape: Sphere, 10 sides`,`Rotate (E)`,`Group Ctrl+G`]},{title:`Skeleton: joints and bones`,text:`A skeleton lets a 3D app bend the character. The white balls are joints (hips, knees, shoulders, elbows, wrists, neck, head) and the teal lines between them are bones. Each bone is moved by the joint it starts from, so turning a shoulder swings the whole arm. When you export to GLB, every part is skinned to these joints automatically: long parts like arms and legs bend smoothly at the joints, small parts like a helmet or a pouch follow one joint. Press Pose, pick a joint and turn it with the rings: the character bends right in the editor.`,tools:[`Skeleton panel (under Layers)`,`Drag a joint`,`Shift+drag: carry its children`,`Pose mode: turn a joint`],rig:!0}],challenge:`Make the goalkeeper: change the kit colors, add gloves by making the hands bigger, and move both arms out to the sides.`,parts:Zy},Ob=`#1b1d21`,kb=`#555c65`,Ab=`#353a41`,jb=`#747c86`,Mb=`#9aa2ab`,Nb=`#aab2ba`,Pb=`#2a2e34`,Fb=`#2f5675`,Ib=`#5aa0cf`,Lb=`#d9a77c`,Rb=`#e0b43a`,zb=`#b58f22`,Bb=Math.PI/8,Vb=[],Q=(...e)=>Vb.push(...e),$=(e,t)=>({p:e,r:t}),Hb=q([$([0,.87,0],[.2,.135]),$([0,.95,0],[.208,.14]),$([0,1.12,.004],[.232,.148]),$([0,1.28,.008],[.27,.152]),$([0,1.4,.012],[.262,.14])],{sides:8,phase:Bb}),Ub=pv([0,.86,0],[.215,.1,.14],8),Wb=q([$([0,.97,.002],[.222,.158]),$([0,1.12,.006],[.248,.166]),$([0,1.28,.01],[.287,.17]),$([0,1.4,.014],[.272,.152])],{sides:8,phase:Bb}),Gb=1.22,Kb=[0,1.7,.014],qb=mv(Kb,[.18*Gb,.2*Gb,.19*Gb],10),Jb=q([$([0,1.74,-.004],[.262,.262]),$([0,1.8,-.004],[.276,.276]),$([0,1.89,-.004],[.268,.268]),$([0,1.95,-.004],[.22,.22]),$([0,1.985,-.004],[.11,.11])],{sides:8,phase:Bb,end:`dome`});for(let e of[1,-1])Q(...Cv(0,e,[e*.115,.215,0],0,{boot:Ob,sole:jb,cuff:Ab,laces:Mb}));var Yb=e=>[$([e*.105,.9,0],.122),$([e*.11,.72,.012],.114),$([e*.118,.52,.035],.094),$([e*.116,.36,.015],.088),$([e*.115,.22,0],.082),$([e*.115,.14,0],.082)];for(let e of[1,-1]){let t=e===1?`Left`:`Right`,n=q(Yb(e),{sides:8});Q(J(1,`Leg ${t}`,n,kb));let r=gv(n,[e*.118,.52,.035],[0,0,1],-.01);Q(J(1,`Knee Pad ${t}`,pv(r.p,[.085,.075,.045],6),Ob)),Q(_v(1,`Cargo P
